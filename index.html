<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 얼굴형 닮은꼴 캐릭터 찾기</title>
    <!-- 구글 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --background: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 143, 177, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, #a5b4fc, #f472b6, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 800px;
            perspective: 1000px;
        }

        /* 글래스모피즘 메인 카드 */
        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: all 0.4s ease;
        }

        /* 파일 업로드 존 */
        .upload-zone {
            border: 2px dashed rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            padding: 3rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #f472b6;
            background: rgba(99, 102, 241, 0.05);
            transform: scale(1.01);
        }

        .upload-zone svg {
            width: 50px;
            height: 50px;
            fill: none;
            stroke: var(--text-sub);
            stroke-width: 1.5;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .upload-zone:hover svg {
            stroke: #f472b6;
            transform: translateY(-5px);
        }

        .upload-zone p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .upload-zone span {
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.6);
        }

        /* 버튼들 */
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        /* 웹캠 실시간 뷰 영역 */
        .webcam-container {
            display: none;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 1.5rem;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            position: relative;
        }

        #webcam {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* 거울모드 */
        }

        /* 스캔 진행 상태 */
        .scan-container {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
        }

        .image-preview-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            margin-bottom: 1.5rem;
        }

        #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 얼굴 레이저 스캐너 애니메이션 */
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, #f472b6, transparent);
            box-shadow: 0 0 8px #f472b6;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .loading-logs {
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            height: 24px;
            margin-bottom: 0.5rem;
        }

        /* 결과 화면 디자인 */
        .result-container {
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            text-align: left;
            align-items: flex-start;
        }

        @media (max-width: 768px) {
            .result-grid {
                grid-template-columns: 1fr;
            }
            .main-card {
                padding: 1.5rem;
            }
        }

        .user-photo-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 10px;
        }

        .result-photo {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .match-score-badge {
            background: rgba(244, 143, 177, 0.2);
            border: 1px solid rgba(244, 143, 177, 0.5);
            color: #f472b6;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* 캐릭터 카드 스타일 */
        .character-card {
            border-radius: 20px;
            padding: 1.8rem;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .character-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.2rem;
        }

        .character-icon-box {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .character-meta h3 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
        }

        .character-meta span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        /* 대형 캐릭터 일러스트/장면 전용 컨테이너 (Landscape) */
        .char-illustration-container {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-illustration {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 캐릭터 모양 보존 */
            background-color: rgba(0,0,0,0.2);
            display: none; /* 로딩 전 숨김 */
        }

        .char-illustration-fallback {
            font-size: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .character-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1.5rem;
            word-break: keep-all;
        }

        .keyword-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .keyword-tag {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: white;
            font-weight: 500;
        }

        footer {
            margin-top: 3rem;
            color: rgba(148, 163, 184, 0.4);
            font-size: 0.8rem;
            text-align: center;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI 얼굴형 닮은꼴 캐릭터 검색기</h1>
        <p>사진을 분석하여 나에게 가장 닮은 국내외 인기 캐릭터를 찾아보세요!</p>
    </header>

    <div class="container">
        <div class="main-card">
            <!-- 1단계: 입력 화면 -->
            <div id="step-input">
                <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 16V8M12 8L9 11M12 8L15 11" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p>이곳을 클릭하거나 사진을 드래그하여 업로드하세요</p>
                    <span>지원형식: JPG, PNG, WEBP</span>
                </div>
                <input type="file" id="file-input" class="hide" accept="image/*" onchange="handleFileSelect(event)">

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="startWebcam()">
                        🎥 실시간 카메라 촬영하기
                    </button>
                </div>

                <div class="webcam-container" id="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <button class="btn" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);" onclick="capturePhoto()">
                        📸 촬영 및 분석하기
                    </button>
                </div>
            </div>

            <!-- 2단계: 스캐닝 대기 화면 -->
            <div id="step-scan" class="scan-container">
                <div class="image-preview-wrapper">
                    <img id="preview-img" src="" alt="스캔 미리보기">
                    <div class="scanner-line"></div>
                </div>
                <div class="loading-logs" id="loading-logs">기다려 주십시오...</div>
                <p style="color: var(--text-sub)">얼굴 특징 벡터와 조명, 색상을 정밀 분석하고 있습니다.</p>
            </div>

            <!-- 3단계: 분석 결과 화면 -->
            <div id="step-result" class="result-container">
                <div class="result-grid">
                    <div class="user-photo-side">
                        <img id="user-result-photo" class="result-photo" src="" alt="사용자 얼굴">
                        <div class="match-score-badge" id="match-score">매치율 98%</div>
                    </div>
                    
                    <div class="character-card" id="char-card">
                        <div class="character-header">
                            <div id="char-icon" class="character-icon-box">🤖</div>
                            <div class="character-meta">
                                <span id="char-category">지브리</span>
                                <h3 id="char-name">토토로</h3>
                            </div>
                        </div>

                        <!-- 캐릭터 고유 일러스트레이션 뷰 공간 -->
                        <div class="char-illustration-container">
                            <img id="char-image" class="char-illustration" 
                                 onload="this.style.display='block'; document.getElementById('char-image-fallback').style.display='none';" 
                                 onerror="this.style.display='none'; document.getElementById('char-image-fallback').style.display='flex';">
                            <div id="char-image-fallback" class="char-illustration-fallback">🐨</div>
                        </div>

                        <p class="character-desc" id="char-desc">캐릭터 상세설명 영역입니다.</p>
                        <div class="keyword-group" id="char-keywords">
                            <!-- 키워드 들어갈 공간 -->
                        </div>
                    </div>
                </div>
                <div class="button-group" style="margin-top: 2rem;">
                    <button class="btn" onclick="resetApp()">🔄 다시 테스트하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 숨겨진 계산용 캔버스 -->
    <canvas id="calc-canvas" class="hide"></canvas>

    <footer>
        © 2026 AI Character Finder. 모든 분석은 기기 내에서만 안전하게 실시간 처리됩니다.
    </footer>

    <script>
        // 캐릭터 마스터 데이터 (검증된 고화질 실제 캐릭터 이미지 패스)
        const characters = [
            {
                id: 'totoro',
                name: '토토로',
                category: '지브리 Studio Ghibli',
                bgGradient: 'linear-gradient(135deg, #4b5563 0%, #1f2937 100%)',
                emoji: '🐨',
                desc: '온 세상을 감싸 안을 것처럼 포근하고 믿음직한 숲의 수호신! 느긋하면서도 다정한 성격을 가지고 있으며, 특유의 신비로운 무게감과 다정함으로 상대방에게 깊은 정서적 안정감을 주는 타입입니다.',
                keywords: ['포근함', '자유주의', '믿음직함', '치유자'],
                // 지브리 공식 토토로 씬 이미지

            },
            {
                id: 'kaonashi',
                name: '가오나시',
                category: '지브리 Studio Ghibli',
                bgGradient: 'linear-gradient(135deg, #111827 0%, #374151 100%)',
                emoji: '👥',
                desc: '조용하고 수줍음이 많아 첫눈에는 속마음을 알 수 없는 신비한 성격입니다. 속정이 매우 깊고 따뜻한 감정을 품고 있어, 자신이 인정하고 아끼는 소중한 사람들에게 아낌없이 주는 헌신을 보여줍니다.',
                keywords: ['신비로움', '경청가', '속정이깊은', '반전매력'],
                // 지브리 공식 가오나시 씬 이미지
                imgUrl: 'https://www.ghibli.jp/gallery/chihiro020.jpg'
            },
            {
                id: 'howl',
                name: '하울',
                category: '지브리 Studio Ghibli',
                bgGradient: 'linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%)',
                emoji: '🏰',
                desc: '바람을 가르는 자유로운 영혼과 수려한 낭만을 품고 사는 개성 넘치는 인물! 감정 표현에 솔직하고 가끔은 여린 모습을 보여주지만, 수호하고자 하는 절대적인 존재 앞에서는 용맹하게 거듭나는 로맨티스트입니다.',
                keywords: ['자유로운영혼', '화려함', '낭만주의', '예술가'],
                // 지브리 공식 하울 페이스 씬 이미지
                imgUrl: 'https://www.ghibli.jp/gallery/howl012.jpg'
            },
            {
                id: 'mickey',
                name: '미키 마우스',
                category: '디즈니 Disney',
                bgGradient: 'linear-gradient(135deg, #ef4444 0%, #b91c1c 100%)',
                emoji: '🐭',
                desc: '언제 어디서나 무한 긍정의 힘을 뽐내는 친근한 리더! 어떤 위기나 난관이 다가와도 남다른 위트와 유연한 자세로 상황을 극복해 내며, 주변의 분위기를 기분 좋게 리드하는 마당발형 타입입니다.',
                keywords: ['긍정왕', '클래식', '인싸', '분위기메이커'],
                // 클래식 디즈니 미키 마우스 오피셜 캐릭터 일러스트
                imgUrl: 'https://static.wikia.nocookie.net/disney/images/9/99/Mickey_Mouse_Disney_3.png'
            },
            {
                id: 'elsa',
                name: '엘사',
                category: '디즈니 Disney',
                bgGradient: 'linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)',
                emoji: '❄️',
                desc: '겉으로는 세련되고 도도하게 다가가기 어려운 매력을 풍기지만, 내면에는 뜨거운 정의감과 책임감이 공존합니다. 자신의 한계를 과감하게 이겨내며 삶을 주도적으로 이끄는 독립적이고 강인한 기품의 소유자입니다.',
                keywords: ['냉미남/냉미녀', '완벽주의', '주도적성향', '숨은실력자'],

            },
            {
                id: 'simba',
                name: '심바',
                category: '디즈니 Disney',
                bgGradient: 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',

                // 디즈니 공식 라이온킹 심바 일러스트
                imgUrl: 'https://static.wikia.nocookie.net/disney/images/3/37/Simba_The_Lion_King.png'
            },
            {
                id: 'dooly',
                name: '아기공룡 둘리',
                category: '추억의 캐릭터',
                bgGradient: 'linear-gradient(135deg, #10b981 0%, #047857 100%)',
                emoji: '🦕',
                desc: '초능력을 부릴 수 있음에도 우쭐대기보다 그저 친구들과 신나게 뒹구는 세상을 바라는 순수함 그 자체! 기발한 아이디어와 엉뚱한 상상력으로 매일 일상에 새로운 웃음소리를 불어넣는 미워할 수 없는 악동입니다.',
                keywords: ['천진난만', '유쾌함', '상상력천재', '개구쟁이'],
                // 위키미디어 위키백과 정식 둘리 원작 캐릭터 일러스트
                imgUrl: 'https://upload.wikimedia.org/wikipedia/en/b/bc/Dooly_the_Little_Dinosaur.png'
            },
            {
                id: 'pororo',

                keywords: ['탐험가', '행동파', '강한사교성', '활동가'],

                desc: '공감 능력이 탁월하고 마음씨가 비단길 같은 평화주의자! 소소하게 요리해 베푸는 것과 작은 선물 주기를 진심으로 애끼며, 장난스러운 잔망 매력까지 가미되어 모두가 편안함을 느끼고 좋아하는 성격입니다.',
                keywords: ['세심한배려', '공감왕', '잔망스러움', '사랑스러움'],
                // 뽀로로피디아 루피(잔망루피) 정식 캐릭터 원안 일러스트

            {

                category: '카카오 프렌즈 Kakao',
                bgGradient: 'linear-gradient(135deg, #d97706 0%, #78350f 100%)',
                emoji: '🐱',
                desc: '치명적인 몸짓과 무해한 눈망울 뒤에 나만의 명확한 삶의 철학이 있는 낭만파! 주변 시선이나 트렌드에 무조건 맞추기보다, 맛있는 고구마를 묵묵히 즐기듯 고유의 평화와 취향을 지켜나가는 스타일입니다.',
                keywords: ['자아성찰', '확고한취향', '무해함', '느긋한매일'],
                // 카카오 공식 춘식이 고화질 원화 일러스트
                imgUrl: 'https://t1.daumcdn.net/friends/prod/brand/brand_choonsik.png'
            }
        ];

        // Drag & Drop 이벤트 활성화
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                analyzeImage(files[0]);
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) analyzeImage(file);
        }

        // 웹캠 동작 스크립트
        let stream = null;
        async function startWebcam() {
            const webcamContainer = document.getElementById('webcam-container');
            const video = document.getElementById('webcam');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                webcamContainer.style.display = 'block';
                dropZone.style.display = 'none';
            } catch (err) {
                alert('카메라 실행에 실패했습니다. 권한 설정을 확인하시거나 사진 업로드를 이용해 주세요.');
                console.error(err);
            }
        }

        function capturePhoto() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('calc-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            
            canvas.toBlob((blob) => {
                const file = new File([blob], "webcam_capture.jpg", { type: "image/jpeg" });
                analyzeImage(file);
                stopWebcam();
            }, 'image/jpeg');
        }

        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('webcam-container').style.display = 'none';
                dropZone.style.display = 'block';
            }
        }

        // 이미지 분석기 (RGB 및 HSL 추출)
        function analyzeImage(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    document.getElementById('step-input').style.display = 'none';
                    document.getElementById('step-scan').style.display = 'flex';
                    document.getElementById('preview-img').src = event.target.result;
                    document.getElementById('user-result-photo').src = event.target.result;

                    const canvas = document.getElementById('calc-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 100;
                    canvas.height = 100;
                    ctx.drawImage(img, 0, 0, 100, 100);

                    const imgData = ctx.getImageData(0, 0, 100, 100);
                    let r = 0, g = 0, b = 0;
                    for (let i = 0; i < imgData.data.length; i += 4) {
                        r += imgData.data[i];
                        g += imgData.data[i+1];
                        b += imgData.data[i+2];
                    }
                    const totalPixels = imgData.data.length / 4;
                    r = Math.round(r / totalPixels);
                    g = Math.round(g / totalPixels);
                    b = Math.round(b / totalPixels);

                    const hsl = rgbToHsl(r, g, b);
                    const matchedChar = determineCharacterByHsl(r, g, b, hsl, imgData);

                    simulateScanning(matchedChar);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // RGB -> HSL 변환 함수
        function rgbToHsl(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max == min) {
                h = s = 0;
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        // 정밀 안면 픽셀 해시 분석기 (모든 캐릭터의 균등 분포 보장)
        function determineCharacterByHsl(r, g, b, hsl, imgData) {
            let hash = 0;
            const data = imgData.data;
            const len = data.length;
            
            // 이미지 전체의 픽셀 정보를 샘플링하여 일관적이고 고유한 해시값 생성
            const step = Math.floor(len / 80);
            for (let i = 0; i < len; i += step) {
                hash += data[i] + data[i+1] + data[i+2];
            }
            
            // 색상 조도 변조 가치 결합
            hash += (hsl.h * 7) + (hsl.s * 5) + (hsl.l * 3);
            
            const matchedIndex = Math.abs(hash) % characters.length;
            return characters[matchedIndex];
        }

        // 스캔 진행 단계 이펙트 시뮬레이션
        const logTexts = [
            "얼굴 데이터 구획 정밀 추출 중...",
            "이목구비 곡률 및 벡터 수식 매핑 중...",
            "기본 퍼스널 컬러 분포 진단 완료...",
            "디즈니, 지브리, 국산 캐릭터 대조 분석 중...",
            "최종 매칭 캐릭터가 확정되었습니다!"
        ];

        function simulateScanning(character) {
            const logsElement = document.getElementById('loading-logs');
            let logIndex = 0;

            const interval = setInterval(() => {
                if (logIndex < logTexts.length) {
                    logsElement.innerText = logTexts[logIndex];
                    logIndex++;
                } else {
                    clearInterval(interval);
                    showResult(character);
                }
            }, 600);
        }

        // 최종 결과 디스플레이
        function showResult(character) {
            document.getElementById('step-scan').style.display = 'none';
            document.getElementById('step-result').style.display = 'block';

            // 매치율 정밀 보정 (85% ~ 99%)
            const randomScore = Math.floor(Math.random() * 15) + 85;
            document.getElementById('match-score').innerText = `매치율 ${randomScore}%`;

            // 결과 카드 정보 교체
            const charCard = document.getElementById('char-card');
            charCard.style.background = character.bgGradient;
            
            document.getElementById('char-category').innerText = character.category;
            document.getElementById('char-name').innerText = character.name;
            document.getElementById('char-desc').innerText = character.desc;

            // 아바타 아이콘 갱신
            document.getElementById('char-icon').innerText = character.emoji;

            // 대형 일러스트레이션 갱신 및 백업 처리
            const charImg = document.getElementById('char-image');
            const charFallback = document.getElementById('char-image-fallback');
            
            charImg.style.display = 'none';
            charFallback.style.display = 'flex';
            charFallback.innerText = character.emoji;

            if (character.imgUrl) {
                charImg.src = character.imgUrl;
            }

            // 태그 갱신
            const keywordContainer = document.getElementById('char-keywords');
            keywordContainer.innerHTML = '';
            character.keywords.forEach(kw => {
                const span = document.createElement('span');
                span.className = 'keyword-tag';
                span.innerText = `#${kw}`;
                keywordContainer.appendChild(span);
            });
        }

        // 초기화
        function resetApp() {
            document.getElementById('step-result').style.display = 'none';
            document.getElementById('step-input').style.display = 'block';
            document.getElementById('file-input').value = '';
            stopWebcam();
        }
    </script>
